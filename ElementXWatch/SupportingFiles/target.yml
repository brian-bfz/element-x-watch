targets:
  ElementXWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: ../ElementXWatch
        name: ElementXWatch
    dependencies:
      - package: KeychainAccess
      - package: Kingfisher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BASE_BUNDLE_IDENTIFIER).watch"
        INFOPLIST_FILE: ElementXWatch/SupportingFiles/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: 9.0
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: 4 # WatchOS
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: Element X
        UIRequiresFullScreen: true
        WKApplication: true
        WKCompanionAppBundleIdentifier: "$(BASE_BUNDLE_IDENTIFIER)"
        LSMinimumSystemVersion: "9.0" 